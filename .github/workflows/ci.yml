name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: livingplus
          POSTGRES_PASSWORD: livingplus
          POSTGRES_DB: livingplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livingplus -d livingplus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests use this database instead of starting an embedded PostgreSQL.
      TEST_DATABASE_URL: postgresql://livingplus:livingplus@localhost:5432/livingplus_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Project/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
