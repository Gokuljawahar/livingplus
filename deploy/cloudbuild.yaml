# Builds the single LivingPlus image (API + frontend) with Cloud Build.
# Used by deploy/gcp-deploy.sh:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions _IMAGE=...,_ENCRYPTION_SECRET=...,_VITE_GOOGLE_MAPS_API_KEY=... .
substitutions:
  _IMAGE: ''
  _ENCRYPTION_SECRET: livingplus-encryption-key
  _VITE_GOOGLE_MAPS_API_KEY: ''

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_ENCRYPTION_SECRET}/versions/latest
      env: VITE_ENCRYPTION_KEY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['VITE_ENCRYPTION_KEY']
    args:
      - -c
      - >-
        docker build -t '${_IMAGE}'
        --build-arg VITE_ENCRYPTION_KEY="$$VITE_ENCRYPTION_KEY"
        --build-arg VITE_GOOGLE_MAPS_API_KEY='${_VITE_GOOGLE_MAPS_API_KEY}'
        --build-arg VITE_SINGLE_HOST_MODE=true
        .

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
