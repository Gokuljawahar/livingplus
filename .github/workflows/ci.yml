name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/backend
    services:
      postgres:
        # PostgreSQL 18 with pgvector, like Cloud SQL, so the pgvector search path is tested.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: livingplus
          POSTGRES_PASSWORD: livingplus
          POSTGRES_DB: livingplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livingplus -d livingplus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests use this database instead of starting an embedded PostgreSQL.
      TEST_DATABASE_URL: postgresql://livingplus:livingplus@localhost:5432/livingplus_test
      EXPECT_PGVECTOR: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Project/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Shared rules are built from source
        working-directory: Project/shared
        run: npm run build && git diff --exit-code -- dist

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            Project/backend/package-lock.json
            Project/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Project/backend
        run: npm ci && npx prisma generate

      - name: Install frontend dependencies
        working-directory: Project/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: Project/frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: Project/frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Project/frontend/playwright-report
          retention-days: 7
